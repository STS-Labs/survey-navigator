<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b6e4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Navigator">
<meta name="description" content="Turn-by-turn navigation for street-coverage survey routes">
<title>Survey Navigator</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="vendor/maplibre-gl-4.7.1/maplibre-gl.css">
<link rel="stylesheet" href="css/app.css">
<script src="vendor/maplibre-gl-4.7.1/maplibre-gl.js" defer></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="map"></div>

  <!-- Driving view -->
  <section id="navUi" hidden>
    <div class="top" id="top">
      <div id="banner" class="banner wait">
        <div class="b-icon" id="bIcon"></div>
        <div class="b-text">
          <div class="b-dist" id="bDist"></div>
          <div class="b-instr" id="bInstr"></div>
          <div class="b-street" id="bStreet"></div>
        </div>
      </div>
      <div id="thenChip" class="then" hidden><span id="thenLabel"></span><span class="then-icon" id="thenIcon"></span></div>
      <div id="gpsHelp" class="gpshelp" hidden>
        <div class="gh-title" id="ghTitle"></div>
        <div class="gh-text" id="ghText"></div>
        <div class="gh-btns"><button id="ghRetry" class="btn"></button><button id="ghPractice" class="btn"></button></div>
      </div>
    </div>
    <button id="recenter" class="pill" hidden></button>
    <div id="toast" class="toast" hidden><span id="toastText"></span><button id="toastBtn" hidden></button></div>
    <footer class="bottom" id="bottom">
      <div id="simBar" class="simbar" hidden>
        <button data-mult="1">1×</button><button data-mult="4">4×</button><button data-mult="10">10×</button>
        <button id="simMiss"></button><button id="simStop"></button>
      </div>
      <div class="bar"><div id="barFill"></div><div id="barMissed"></div></div>
      <div class="row">
        <div class="stat">
          <div id="statKm" class="big"></div>
          <div class="small"><span id="gpsChip" class="gpschip none"></span> · <span id="statEta"></span></div>
        </div>
        <div class="btns">
          <button id="btnOverview" class="round" aria-label="Overview"><svg viewBox="0 0 24 24"><path d="M4 6l5-2 6 2 5-2v14l-5 2-6-2-5 2z M9 4v14 M15 6v14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>
          <button id="btnMute" class="round" aria-label="Sound"></button>
          <button id="btnMenu" class="round" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        </div>
      </div>
    </footer>
  </section>

  <!-- Checking the turns before driving -->
  <section id="previewUi" hidden>
    <div class="preview-card">
      <div class="p-head">
        <div class="p-icon" id="pIcon"></div>
        <div class="p-text">
          <div class="p-instr" id="pInstr"></div>
          <div class="p-street" id="pStreet"></div>
          <div class="p-meta" id="pMeta"></div>
        </div>
      </div>
      <div class="p-btns">
        <button id="pPrev" class="btn"></button>
        <button id="pNext" class="btn"></button>
      </div>
      <div class="p-btns">
        <button id="pStart" class="btn primary"></button>
        <button id="pClose" class="btn"></button>
      </div>
    </div>
  </section>

  <!-- Start screen -->
  <section id="home" class="home"></section>

  <!-- Menu while driving -->
  <div id="sheetBack" class="sheet-back" hidden></div>
  <div id="sheet" class="sheet" hidden></div>

  <input id="file" type="file" hidden>
</body>
</html>
