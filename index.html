<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0c0e15">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="STS NAV">
<meta name="description" content="STS NAV: turn-by-turn navigation for street-coverage survey routes">
<title>STS NAV</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preload" href="fonts/noto-sans-georgian.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vendor/maplibre-gl-4.7.1/maplibre-gl.css">
<link rel="stylesheet" href="css/app.css">
<script src="vendor/maplibre-gl-4.7.1/maplibre-gl.js" defer></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="map"></div>

  <!-- Driving view -->
  <section id="navUi" hidden>
    <div class="fade" aria-hidden="true"></div>
    <div class="top" id="top">
      <div id="banner" class="banner glass tone-grey">
        <div class="b-icon" id="bIcon"></div>
        <div class="b-text">
          <div class="b-tag" id="bTag" hidden><i></i><span id="bTagText"></span></div>
          <div class="b-dist" id="bDist"></div>
          <div class="b-instr" id="bInstr"></div>
          <div class="b-street" id="bStreet"></div>
        </div>
      </div>
      <div class="pills">
        <div id="thenChip" class="pill glass then" hidden><span id="thenLabel"></span><span class="then-icon" id="thenIcon"></span></div>
      </div>
      <div id="gpsHelp" class="glass gpshelp" hidden>
        <div class="gh-head"><span class="gh-icon" id="ghIcon"></span><div class="gh-title" id="ghTitle"></div></div>
        <div class="gh-text" id="ghText"></div>
        <div class="gh-btns"><button id="ghRetry" class="btn primary"></button><button id="ghPractice" class="btn"></button></div>
      </div>
      <div id="pauseCard" class="glass pausecard" hidden>
        <div class="pc-text" id="pcText"></div>
        <button id="pcResume" class="btn primary"></button>
      </div>
    </div>
    <div class="side">
      <button id="btnMenu" class="round glass" aria-label="Menu"></button>
      <button id="btnMute" class="round glass" aria-label="Sound"></button>
      <button id="btnPause" class="round glass" aria-label="Pause"></button>
    </div>
    <div class="dock" id="dock">
      <div class="dock-row">
        <button id="btnSkip" class="round glass" aria-label="Skip"></button>
        <button id="btnRecenter" class="round accent" hidden aria-label="Back to the car"></button>
      </div>
      <div id="toast" class="glass toast" hidden><span id="toastText"></span><button id="toastBtn" hidden></button></div>
      <div id="simBar" class="glass simbar" hidden>
        <div class="sim-head"><span id="simTitle"></span><div class="seg3"><button data-mult="1">1×</button><button data-mult="4">4×</button><button data-mult="10">10×</button></div></div>
        <div class="sim-btns"><button id="simMiss"></button><button id="simStop"></button></div>
      </div>
    </div>
    <footer class="bottom" id="bottom">
      <div class="status">
        <div class="st-line"><span id="stTime" class="st-time"></span><i>•</i><span id="stKm" class="st-km"></span><i>•</i><span id="stEnd" class="st-end"></span></div>
        <span id="gpsChip" class="gpschip none">GPS</span>
      </div>
      <div class="bar"><div id="barFill"></div><div id="barMissed"></div></div>
    </footer>
  </section>

  <!-- Start screen -->
  <section id="home" class="home"></section>

  <!-- Menu while driving -->
  <div id="sheetBack" class="sheet-back" hidden></div>
  <div id="sheet" class="sheet" hidden></div>

  <input id="file" type="file" hidden>
</body>
</html>
